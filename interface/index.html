<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aevifex & NEXUS — Oficina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TOP EXECUTIVE HUD BAR -->
  <header class="hud-header">
    <div class="hud-brand">
      <div class="logo-badge" onclick="navigateTo('overview')" style="cursor: pointer;" title="Ir a la portada de Aevifex">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Aevifex</span>
      </div>
      <span class="hud-sep">/</span>
      <div class="instance-badge">
        <span class="pulse-dot"></span>
        <span class="instance-name">NEXUS</span>
      </div>
    </div>

    <div class="hud-active-front" id="hudActiveFront" title="Tareas activas en el muro">
      <span class="front-marker">▶ ACTIVE FRONT</span>
      <span class="front-title">Cargando frente activo...</span>
    </div>


    <div class="hud-controls">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="globalSearch" placeholder="Buscar (D_n, comandos, ideas, tareas)… (Ctrl+K)">
      </div>
      <div class="hud-pill live-pill" title="Live sync activo cada 2s">
        <span class="heartbeat"></span>
        <span id="syncStatus">2.0s</span>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
      <div class="sidebar-section-title">VISTAS PRINCIPALES</div>
      <nav class="nav-menu">
        <button class="nav-item active" data-view="overview">
          <span class="nav-icon">🏛️</span>
          <span class="nav-label">Portada</span>
          <span class="nav-badge star-badge">v1.1</span>
        </button>
        <button class="nav-item" data-view="projects">
          <span class="nav-icon">🚀</span>
          <span class="nav-label">Proyectos</span>
          <span class="nav-badge count-badge" id="badgeProjects">0</span>
        </button>
        <button class="nav-item" data-view="cockpit">
          <span class="nav-icon">🗂️</span>
          <span class="nav-label">Oficina</span>
          <span class="nav-badge live-badge">LIVE</span>
        </button>
        <button class="nav-item" data-view="inbox">
          <span class="nav-icon">📬</span>
          <span class="nav-label">Buzón</span>
          <span class="nav-badge count-badge" id="badgeMailbox" title="Entradas de buzón sin cerrar">0</span>
        </button>
        <button class="nav-item" data-view="notebook">
          <span class="nav-icon">🗒️</span>
          <span class="nav-label">Notebook</span>
          <span class="nav-badge count-badge" id="badgeNotebook">0</span>
        </button>
        <button class="nav-item" data-view="library">
          <span class="nav-icon">📚</span>
          <span class="nav-label">Biblioteca</span>
          <span class="nav-badge count-badge" id="badgeLibrary">0</span>
        </button>
        <button class="nav-item" data-view="dashboard">
          <span class="nav-icon">📐</span>
          <span class="nav-label">Dashboard</span>
          <span class="nav-badge star-badge">PH-6</span>
        </button>
        <button class="nav-item" data-view="skills">
          <span class="nav-icon">🏺</span>
          <span class="nav-label">Ágora</span>
          <span class="nav-badge count-badge" id="badgeSkills">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="filter-group">
          <label for="projectFilter">Filtrar por proyecto</label>
          <select id="projectFilter" class="custom-select">
            <option value="ALL">Todos los proyectos</option>
          </select>
        </div>
        <div class="version-tag">
          <span>Aevifex v1.1.0</span>
          <span>NEXUS 3.0</span>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content" id="mainContent">
      <div class="loading-state">
        <div class="spinner"></div>
        <h3>Cargando modelo de operaciones...</h3>
        <p>Sincronizando entidades desde <code>/api/model</code></p>
      </div>
    </main>
  </div>



  <!-- TOAST NOTIFICATION -->
  <div class="toast-notification" id="toast">
    <span class="toast-icon">✅</span>
    <span class="toast-msg" id="toastMsg">Acción completada</span>
  </div>

  <!-- Antes que `app.js`: define `esc`, `inline` y `jsq`, que ese fichero usa. -->
  <script src="render/escape.js"></script>
  <script src="vendor/markdown-it/markdown-it.umd.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/mhchem.min.js"></script>
  <script src="render/library.js"></script>
  <script src="render/mailbox.js"></script>
  <script src="render/notebook.js"></script>
  <script src="render/references.js"></script>
  <script src="app.js"></script>
</body>
</html>
